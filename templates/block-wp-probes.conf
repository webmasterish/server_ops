# /etc/apache2/conf-available/block-wp-probes.conf
#
# Origin-side mirror of the Cloudflare WAF custom rule. Deploy with
# scripts/install-block-wp-probes.sh, which config-tests before reloading.
#
# WHY MIRROR A RULE CLOUDFLARE ALREADY ENFORCES. The edge rule is the one that
# saves bandwidth and CPU, and it handles ~5,000 requests/day. This one exists
# for the case the edge is not in the path at all: a direct hit on the Hetzner
# IP, a DNS record accidentally set to "DNS only" instead of proxied, or a zone
# where the rule was never added. Defence that only works when the CDN is
# correctly configured is defence with a single point of failure.
#
# All ten WordPress installs on this server live at /cms (verified 2026-08-09:
# ayatalquran, dotaim, grand-emerald, hirement, lebanese.tech, menamaps,
# nidaldirani, skinosis, videotizer, singlefunction). Nothing serves WordPress
# from the document root. That fact is what makes the first rule safe, and it
# is the fact to re-check before adding a site that breaks the pattern.

# 1. POST to the ROOT wp-login.php.
#
# The anchor is the whole rule. `^/wp-login\.php$` matches ONLY the document
# root path -- /cms/wp-login.php does not match, so real logins are untouched.
# A `contains`-style match here would deny the actual login form and lock
# everyone out of wp-admin, which is the obvious way to get this wrong.
#
# POST only. A human who types /wp-login.php still gets the normal 302 to
# /cms/wp-login.php; only the automated credential POST is refused. Roughly
# 5,000 of those arrive per day and precisely zero are legitimate, because the
# login form posts to /cms/wp-login.php.
<LocationMatch "^/wp-login\.php$">
	<LimitExcept GET HEAD>
		Require all denied
	</LimitExcept>
</LocationMatch>

# 2. xmlrpc.php, any path, any method.
#
# Mirrors the existing Cloudflare rule, which already blocks this estate-wide
# -- so this is enforcing a decision that has been live for some time, not
# making a new one. Every xmlrpc request observed on 2026-08-09 was a 404
# anyway: no site here serves it.
#
# Worth knowing what this gives up: xmlrpc is how the WordPress mobile app,
# Jetpack, and inbound pingbacks talk to a site. If any of those are ever
# wanted, this rule and the Cloudflare one both have to come off. It is also
# the classic brute-force amplifier -- system.multicall packs many password
# guesses into a single request, which is exactly why it is blocked.
<LocationMatch "(^|/)xmlrpc\.php$">
	Require all denied
</LocationMatch>

# 3. wp-config.php, any path.
#
# Also mirrors the Cloudflare rule. Requesting it normally yields an empty 200
# -- it only defines constants and prints nothing -- so this is not fixing a
# live leak. It is insurance for the one scenario that matters: if PHP ever
# stops handling .php (a broken FPM socket, a pool that fails to start, a
# botched version switch), Apache falls back to serving the file as plain text
# and hands out the database credentials. audit-sites.sh checks for exactly
# that disclosure; this makes it unreachable rather than merely monitored.
<LocationMatch "(^|/)wp-config\.php$">
	Require all denied
</LocationMatch>
