# /etc/logrotate.d/vhosts
#
# Per-site Apache logs under /var/www/vhosts/. The stock apache2 rule only
# globs /var/log/apache2/*.log, so nothing had ever rotated these -- by
# 2026-07-29 they had reached 13.9 GB, one access.log accounting for 13.1 GB
# of it after ~11 months of uptime.
#
# Two glob lines because sites nest one level deeper when they are subdomains:
#   /var/www/vhosts/<group>/<domain>/logs/
#   /var/www/vhosts/<group>/<domain>/subs/<sub>/logs/
#
# Deploy with scripts/install-logrotate.sh, which validates before installing.

/var/www/vhosts/*/*/logs/*.log
/var/www/vhosts/*/*/subs/*/logs/*.log
{
	# Time-based, not size-based, and deliberately so. Traffic across these 17
	# vhosts spans roughly 250:1 (ayatalquran.com 31 MB/day, nidaldirani.com
	# 0.12 MB/day). Under a `size` trigger, retention becomes a function of
	# traffic: ~3 days of history for the busiest site and 800+ days for the
	# quietest -- shortest history exactly where it is most likely to be
	# needed. `daily` gives every site the same window, and makes `.5.gz` the
	# same calendar day on all 17 vhosts, so an estate-wide question is one
	# glob rather than a per-site reconstruction.
	#
	# No `maxsize` either: logrotate is invoked once a day here (the systemd
	# timer; /etc/cron.daily/logrotate exits immediately under systemd), and
	# maxsize can only fire *earlier* than the interval. With a daily interval
	# and a daily invocation there is no earlier, so it would be dead config.
	# It would only start doing something if the timer were made hourly.
	daily

	# 30 days. Measured cost of the whole set is ~59 MB/day across 39 files,
	# so 30 generations is ~290 MB against 26 GB free -- about 90 MB more than
	# 14 days. At that price the longer window is effectively free, and it
	# covers late-arriving client reports and month-boundary questions
	# (reconciling Matomo against raw logs, order disputes on menamaps).
	rotate 30

	missingok
	compress
	delaycompress
	notifempty

	# Apache creates these as webmasterish:www-data (see any existing site).
	# Recreating them with different ownership would silently break logging
	# after the first rotation.
	create 664 webmasterish www-data

	# logrotate refuses to rotate files in a directory writable by a non-root
	# user unless told whose privileges to drop to. Without this it skips
	# every one of these logs and says nothing useful about why.
	su webmasterish www-data

	# One reload for the whole set, not one per file. With ~20 log files that
	# is the difference between one graceful restart and twenty.
	sharedscripts

	postrotate
		if pgrep -f ^/usr/sbin/apache2 > /dev/null; then
			invoke-rc.d apache2 reload 2>&1 | logger -t vhosts.logrotate
		fi
	endscript
}
