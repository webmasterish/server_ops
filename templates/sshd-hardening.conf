# /etc/ssh/sshd_config.d/99-hardening.conf
#
# Deploy with scripts/install-sshd-hardening.sh, which validates with `sshd -t`
# and reloads rather than restarts, so open sessions survive a bad edit.
#
# A drop-in rather than an edit to /etc/ssh/sshd_config, for two reasons: the
# stock file is package-managed and a future openssh-server upgrade will offer
# to overwrite it, and every relevant directive in it is commented out, so
# there is nothing to conflict with. `Include /etc/ssh/sshd_config.d/*.conf` is
# line 12 of the stock file -- ahead of every commented default -- and in
# sshd_config the FIRST occurrence of a keyword wins, so this file decides.
#
# 99- prefix so it sorts after anything a package might drop in later.

# The change that matters.
#
# Password auth was on (the compiled-in default; nothing had ever set it), and
# the sshd jail had logged 34,277 failed attempts and 3,181 bans by 2026-08-09
# -- roughly 2,500 scan errors in the last 7 days alone. None of it could ever
# have succeeded, because both accounts on this box authenticate with keys and
# always have. Turning this off does not tighten access, it deletes an attack
# surface that was never in use: password guessing stops being a thing that can
# happen at all, rather than a thing fail2ban has to keep up with.
#
# Verify BEFORE deploying that you can log in by key -- if you are reading this
# over an SSH session you authenticated with a key, you already have.
PasswordAuthentication no

# Belt and braces. With PasswordAuthentication off, sshd can still fall through
# to PAM for password prompts on some builds; this closes that path too.
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
UsePAM yes

# Already the effective setting via the stock file's `prohibit-password`.
# Restated here so the whole policy is legible in one file rather than
# depending on a default two files away.
PermitRootLogin prohibit-password

PubkeyAuthentication yes

# Cuts the window an unauthenticated connection can hold a slot. The scan
# traffic in the logs is mostly kex_exchange_identification resets -- half-open
# connections that never authenticate.
LoginGraceTime 30
MaxAuthTries 4

# 10 concurrent unauthenticated connections, then start dropping 30% of new
# ones, hard limit 60. Costs a legitimate user nothing at this scale and takes
# the edge off the constant background scanning.
MaxStartups 10:30:60
