; menamaps.com -- non-default FPM limits.
;
; Appended to the generated pool by set-site-php.sh. Do NOT move these into the
; pool file by hand: that file is regenerated on every run of the script and
; hand edits are lost silently.
;
; Hostinger's limits for this site are not stock and the site depends on that.
; Each line below is here because something concrete breaks at the Debian
; default, not as headroom for its own sake. See
; docs/handover-menamaps-migration.md §2.
;
;   memory_limit         default 128M -- the Printify client's product list is
;                        multi-MB even slimmed and nearly OOMed at 256M locally;
;                        Apply-all and Refresh-templates die at the default.
;                        1024M, not Hostinger's 2048M: chosen against 3.7 GB of
;                        RAM so one runaway request cannot take the box down.
;   upload_max_filesize  default 2M -- the public story form clamps its own cap
;                        to wp_max_upload_size(), so a 10 MB photo limit
;                        silently becomes 2 MB.
;   post_max_size        default 8M -- multi-photo story submissions.
;   max_execution_time   default 30 -- Printify v2 shipping payloads take
;                        30-86s and the HTTP client allows 180s; wp-admin
;                        Fetch & preview dies at 30.
;   max_input_vars       default 1000 -- WooCommerce variation screens across
;                        861 products (9,824 variations) post large forms.
;
; CLI is unlimited on both hosts and is unaffected by any of this.

php_admin_value[memory_limit] = 1024M
php_admin_value[upload_max_filesize] = 128M
php_admin_value[post_max_size] = 128M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_vars] = 5000
