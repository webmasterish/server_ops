# /etc/apache2/sites-available/000-catchall-ssl.conf
#
# Catch-all for HTTPS requests whose SNI matches no configured site.
#
# THE PROBLEM THIS SOLVES
#
# Apache serves the FIRST vhost defined for an address:port when nothing else
# matches. With per-site SSL vhosts sorted alphabetically in sites-enabled,
# that meant analytics.dotaim.com -- so any HTTPS request for an unknown name
# was answered with the Matomo login page.
#
# That is not theoretical. On 2026-07-29, hirement.com's Cloudflare origin was
# repointed to this server before its certificate existed. Cloudflare was on
# "Full" (encrypted but not validating), so it accepted the wrong certificate
# and served Matomo to hirement.com visitors: HTTP 200, no error anywhere, and
# only caught by reading the page title. The same class of failure has bitten
# this estate before on a previous server, where the fallback was 961.io.
#
# A 526 at least announces itself. This one is silent, which makes it worse.
#
# The filename must sort FIRST in sites-enabled, hence the 000 prefix.
#
# Deploy with scripts/install-catchall-vhost.sh.

<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName catchall.invalid

	# Deliberately a self-signed certificate. Anything reaching this vhost is
	# already misconfigured, and a browser warning is a far better outcome than
	# silently serving another customer's site under a valid-looking padlock.
	SSLEngine on
	SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
	SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

	DocumentRoot /var/www/catchall

	<Directory /var/www/catchall>
		Require all granted
	</Directory>

	# 404 rather than a redirect or an error page that leaks anything about
	# what else is hosted here.
	RedirectMatch 404 ^/.*$

	ErrorLog  /var/log/apache2/catchall-error.log
	CustomLog /var/log/apache2/catchall-access.log combined
</VirtualHost>
</IfModule>

# Same problem exists on port 80, though the consequence is milder because
# there is no certificate to mislead anyone.
<VirtualHost *:80>
	ServerName catchall.invalid
	DocumentRoot /var/www/catchall
	<Directory /var/www/catchall>
		Require all granted
	</Directory>

	# The ACME challenge path stays reachable: a new site being provisioned may
	# need to answer a challenge before its own vhost exists.
	RedirectMatch 404 ^/(?!\.well-known/acme-challenge/).*$

	ErrorLog  /var/log/apache2/catchall-error.log
	CustomLog /var/log/apache2/catchall-access.log combined
</VirtualHost>
